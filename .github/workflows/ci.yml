name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marshal
          POSTGRES_PASSWORD: marshal
          POSTGRES_DB: marshal
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U marshal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: vet
        run: go vet ./...
      - name: unit tests (six stub suites are expected to fail until implemented)
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.out || true
          # Fail CI only if a NON-stub package fails. Stub suites live in
          # pkg/alloc (binpack), pkg/sched (backfill, gang), pkg/preempt
          # (victims), pkg/dispatch (exactly-once).
          if grep -E '^FAIL\s+\S+' test.out | grep -v -E 'pkg/(alloc|sched|preempt|dispatch)\s'; then
            echo "non-stub package failed"; exit 1
          fi
      - name: determinism gate (two identical sim runs)
        run: |
          go build -o bin/marshal-sim ./cmd/marshal-sim
          ./bin/marshal-sim --trace traces/uniform.json --sched fifo --alloc firstfit --seed 42 > run1.txt
          ./bin/marshal-sim --trace traces/uniform.json --sched fifo --alloc firstfit --seed 42 > run2.txt
          cmp run1.txt run2.txt
      - name: chaos campaign (200 seeds)
        run: |
          go build -o bin/marshal-chaos ./cmd/marshal-chaos
          ./bin/marshal-chaos --seeds 200
